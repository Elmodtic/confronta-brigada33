# =====================================================================
#  Confronta Diaria - Nginx como proxy inverso HTTPS local (Windows)
#
#  Coloca este archivo en:  C:\nginx\conf\nginx.conf
#  Arranca Nginx con:       cd C:\nginx  &&  start nginx
#  Recarga tras cambios:    nginx -s reload
#  Detiene:                 nginx -s stop
#
#  El certificado autofirmado YA esta generado en:
#    D:\UNIANDES\7MO SEMESTRE\INTEGRADOR\App\certs\confronta.crt / .key
#  (SAN: localhost, confronta.local, 127.0.0.1, 10.0.2.2, 10.215.110.48 USB, 10.20.91.170 LAN)
#
#  Para regenerarlo (si cambia la IP de la PC), desde la carpeta App:
#    openssl req -x509 -newkey rsa:2048 -sha256 -days 825 -nodes ^
#      -keyout certs\confronta.key -out certs\confronta.crt ^
#      -subj "/C=EC/O=Brigada 33/CN=confronta.local" ^
#      -addext "subjectAltName=DNS:localhost,DNS:confronta.local,IP:127.0.0.1,IP:10.0.2.2,IP:NUEVA.IP"
#    copy certs\confronta.crt android\app\src\main\res\raw\confronta_ca.crt
# =====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Oculta la version de Nginx en las cabeceras y errores.
    server_tokens off;

    # Tamano maximo del cuerpo de las peticiones (coincide con el backend).
    client_max_body_size 1m;

    # Upstream del backend Node/Express (solo escucha en loopback).
    upstream confronta_backend {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # NOTA: el puerto 80 lo conserva Apache de XAMPP (phpMyAdmin), por eso
    # aqui NO se declara ningun server en 80. La app solo usa HTTPS y el
    # trafico en texto plano esta prohibido en el cliente Android.

    # ---- HTTPS (443): proxy hacia el backend ----
    server {
        listen       443 ssl;
        server_name  localhost confronta.local 10.0.2.2 10.215.110.48 10.20.91.170;

        ssl_certificate       "D:/UNIANDES/7MO SEMESTRE/INTEGRADOR/App/certs/confronta.crt";
        ssl_certificate_key   "D:/UNIANDES/7MO SEMESTRE/INTEGRADOR/App/certs/confronta.key";
        ssl_protocols         TLSv1.2 TLSv1.3;
        ssl_ciphers           HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache     shared:SSL:5m;
        ssl_session_timeout   10m;

        # ---- Cabeceras de seguridad estrictas ----
        # Se descartan las que pudiera enviar el backend para no duplicarlas.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header X-Powered-By;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Referrer-Policy           "no-referrer"                         always;
        add_header Cross-Origin-Opener-Policy "same-origin"                        always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        location / {
            proxy_pass         http://confronta_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}
